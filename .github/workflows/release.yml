name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            platform: linux/amd64
            install-linux-deps: true
            build-tags: "-tags webkit2_41"
          - os: ubuntu-24.04-arm
            name: linux-arm64
            platform: linux/arm64
            install-linux-deps: true
            build-tags: "-tags webkit2_41"
          - os: macos-latest
            name: macos-arm64
            platform: darwin/arm64
            install-linux-deps: false
            build-tags: ""
          - os: macos-latest
            name: macos-amd64
            platform: darwin/amd64
            install-linux-deps: false
            build-tags: ""
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
            install-linux-deps: false
            build-tags: ""
          - os: windows-latest
            name: windows-arm64
            platform: windows/arm64
            install-linux-deps: false
            build-tags: ""
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.ref_name }}
      PACKAGE: data-nexus-${{ github.ref_name }}-${{ matrix.name }}.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.install-linux-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare embed assets
        run: make embed-stub

      - name: Build desktop app
        run: wails build -clean ${{ matrix.build-tags }} -platform ${{ matrix.platform }}

      - name: Package release asset (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/bin
          zip "$PACKAGE" data-nexus

      - name: Package release asset (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r "$PACKAGE" data-nexus.app

      - name: Package release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/bin/data-nexus.exe" -DestinationPath "build/bin/$env:PACKAGE" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: build/bin/${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
